# Targets built by .gitcode/workflows/daily_build.yml.
#
# This file is the only place to add, remove or pause a daily target:
#   name    - job/log identifier, [A-Za-z0-9._-] only
#   arch    - sample directory under .oebuild/samples/
#   sample  - sample yaml name without the extension
#   enabled - optional, defaults to true; false makes the daily run
#             skip the target while keeping it documented here
#
# Every entry builds the base image only (bitbake openeuler-image; the
# gate generator drops do_populate_sdk). A missing sample file fails
# the plan job instead of silently skipping the target.
builds:
  - name: kp920
    arch: aarch64
    sample: kp920
  - name: ok3588
    arch: aarch64
    sample: ok3588
  - name: ok3568
    arch: aarch64
    sample: ok3568
  - name: ok-a40i
    arch: arm32
    sample: ok-a40i
  - name: visionfive2
    arch: riscv64
    sample: visionfive2
  - name: hi3093
    arch: aarch64
    sample: hi3093
  - name: 3591rc
    arch: aarch64
    sample: 3591rc
  - name: hipico
    arch: arm32
    sample: hipico
  - name: ok3399
    arch: aarch64
    sample: ok3399
  - name: orangepi4-lts
    arch: aarch64
    sample: orangepi4-lts
  - name: orangepi5
    arch: aarch64
    sample: orangepi5
  - name: roc-rk3588s-pc
    arch: aarch64
    sample: roc-rk3588s-pc
