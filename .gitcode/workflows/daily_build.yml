# SPDX-License-Identifier: Apache-2.0
#
# Daily base-image build for the boards listed in
# .gitcode/ci/daily_targets.yaml.
#
# Schedule: once a day at 22:00 Asia/Shanghai. The platform reads cron
# in UTC+8 (verified on 2026-11-27 with two hour-shifted probes, only
# the 10:19 one fired at 02:19 UTC), so 0 22 is 22:00 CST. Manual runs stay
# available through workflow_dispatch, optionally for a subset and with
# issue creation switched off for debugging.
#
# The platform rejects strategy.matrix at compile time, so every target
# has a static job below. The jobs all call daily_build.sh, which reads
# daily_targets.yaml (enabled flag) and inputs.targets and returns
# without building when the target is not selected. Adding a target
# therefore needs an entry in daily_targets.yaml *and* a job stanza
# here; a missing sample fails the target instead of skipping it.
#
# Only openeuler-image is built (build_image.sh drops the SDK task).
# Results: build jobs record a status file in the shared cache; the
# report job compares them with the expected list and opens one issue
# per day when anything failed (all-green runs post nothing).

name: openeuler_embedded_daily_build

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      targets:
        description: 'comma-separated target subset, empty builds all enabled targets'
        required: false
        default: ''
      create_issue:
        description: 'true opens an issue when a target fails; false for debugging runs'
        required: false
        default: 'true'

permissions:
  repository: read
  pr: read
  # the report job opens the daily issue through the v5 API with the
  # runner token; without this scope the API answers 403 (verified on
  # the test repository)
  issue: write

env:
  GATE_RUN_ID: ${{ atomgit.run_id }}
  # shared cache root (shareDir), same as the PR gate; the daily build
  # reads and writes it, and target status files live under it
  GATE_SHARE_DIR: /home/jenkins/ccache/openeuler_embedded
  # the daily build always reports against master, whatever ref the
  # dispatch selected; every build job rejects other refs
  GATE_TARGET_BRANCH: master
  # build the checkout directly: there is no PR worktree here
  GATE_BUILD_SOURCE: checkout

jobs:
  validate:
    name: Validate target list
    runs-on: [self-hosted, embedded_master, x86, cpu=4]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/openeuler-embedded-2/openeuler-ci:latest
    timeout-minutes: 10
    steps:
      - name: Checkout source code
        uses: checkout
      - name: Check the config against the build jobs
        run: |
          set -e
          python3 .gitcode/workflows/scripts/daily_targets.py check-workflow

  build_kp920:
    name: Build kp920
    needs: validate
    runs-on: [self-hosted, embedded_master, x86, cpu=8]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/openeuler-embedded-2/openeuler-ci:latest
    timeout-minutes: 360
    steps:
      - name: Checkout source code
        uses: checkout
      - name: Build kp920
        env:
          GATE_DAILY_TARGETS: ${{ inputs.targets }}
        run: |
          set -e
          bash .gitcode/workflows/scripts/daily_build.sh kp920 aarch64 kp920

  build_ok3588:
