      image: swr.cn-north-4.myhuaweicloud.com/openeuler-embedded-2/openeuler-ci:latest
    timeout-minutes: 15
    steps:
      - name: Checkout source code
        uses: checkout
      - name: Summarize and report
        env:
          GATE_DAILY_TARGETS: ${{ inputs.targets }}
          GATE_BUILD_RESULTS: ${{ needs.build_kp920.result }},${{ needs.build_ok3588.result }},${{ needs.build_ok3568.result }},${{ needs.build_ok_a40i.result }},${{ needs.build_visionfive2.result }}
          # empty on scheduled runs; the script then defaults to 1
          GATE_DAILY_ISSUE: ${{ inputs.create_issue }}
        run: |
          set -e
          bash .gitcode/workflows/scripts/report_daily.sh