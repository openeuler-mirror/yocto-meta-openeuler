# SPDX-License-Identifier: Apache-2.0
#
# openEuler Embedded PR gate, GitCode Actions edition.
#
# Checks:
#   1. Documentation build - Sphinx (build_docs)
#   2. Image builds for each platform (build_*)

name: openeuler_embedded_PR_gate

on:
  # pull_request_target keeps the workflow definition on the trusted
  # base branch: with plain pull_request a PR could carry its own
  # modified workflow and gate itself (the runner executes the PR-side
  # file). Verified working on the test repository alongside
  # pull_request_comment.
  pull_request_target:
    types:
      - open
      - update
      - reopen
    branches:
      - '**'
  pull_request_comment:
    types:
      - created
    branches:
      - '**'
    comments:
      - '^\s*/retest\s*$'
  workflow_dispatch:

permissions:
  # repository: read covers the checkout; pr: read lets the gate
  # resolve fork PRs through the platform API (the runner token is
  # rejected by the pulls API without it on private repositories;
  # public repositories also work anonymously)
  repository: read
  pr: read

concurrency:
  enable: true
  max: 100
  exceed-action: QUEUE
  preemption:
    enable: true
    events:
      - mr_id

env:
  GATE_RUN_ID: ${{ atomgit.run_id }}
  # shared cache root (shareDir), provisioned on the runner nodes;
  # the gate scripts derive their cache paths from it. Leave empty to
  # build without the cache.
  GATE_SHARE_DIR: /home/jenkins/ccache/openeuler_embedded

jobs:
  build_docs:
    name: Build docs
    runs-on: [self-hosted, embedded_master, x86, cpu=4]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/openeuler-embedded-2/openeuler-ci:latest
    timeout-minutes: 60
    steps:
      - name: Associate run with PR
        uses: associate-pr-comment

      - name: Checkout source code
        uses: checkout

      - name: Point the build at the PR
        run: bash .gitcode/workflows/scripts/checkout_pr.sh

      - name: Build documentation
        run: |
          set -e
          echo "Building documentation..."
          bash .gitcode/workflows/scripts/build_docs.sh

  build_qemu_aarch64:
    name: Build qemu-aarch64
    runs-on: [self-hosted, embedded_master, x86, cpu=8]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/openeuler-embedded-2/openeuler-ci:latest
    timeout-minutes: 360
    steps:
      - name: Checkout source code
        uses: checkout

      - name: Point the build at the PR
        run: bash .gitcode/workflows/scripts/checkout_pr.sh

      - name: Build qemu-aarch64 image
        run: |
          set -e
          echo "Building qemu-aarch64..."
          bash .gitcode/workflows/scripts/build_image.sh \
            aarch64 qemu-aarch64

  build_qemu_arm32:
    name: Build qemu-arm32
    runs-on: [self-hosted, embedded_master, x86, cpu=8]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/openeuler-embedded-2/openeuler-ci:latest
    timeout-minutes: 360
    steps:
      - name: Checkout source code
        uses: checkout

      - name: Point the build at the PR
        run: bash .gitcode/workflows/scripts/checkout_pr.sh

      - name: Build qemu-arm32 image
        run: |
          set -e
          echo "Building qemu-arm32..."
          bash .gitcode/workflows/scripts/build_image.sh \
            arm32 qemu-arm32

  build_x86_64:
    name: Build x86-64
    runs-on: [self-hosted, embedded_master, x86, cpu=8]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/openeuler-embedded-2/openeuler-ci:latest
    timeout-minutes: 360
    steps:
      - name: Checkout source code
        uses: checkout

      - name: Point the build at the PR
        run: bash .gitcode/workflows/scripts/checkout_pr.sh

      - name: Build x86-64 image
        run: |
          set -e
          echo "Building x86-64..."
          bash .gitcode/workflows/scripts/build_image.sh \
            x86-64 x86-64

  build_hieulerpi1:
    name: Build hieulerpi1
    runs-on: [self-hosted, embedded_master, x86, cpu=8]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/openeuler-embedded-2/openeuler-ci:latest
    timeout-minutes: 360
    steps:
      - name: Checkout source code
        uses: checkout

      - name: Point the build at the PR
        run: bash .gitcode/workflows/scripts/checkout_pr.sh

      - name: Build hieulerpi1 image
        run: |
          set -e
          echo "Building hieulerpi1..."
          bash .gitcode/workflows/scripts/build_image.sh \
            aarch64 hieulerpi1

  build_qemu_riscv64:
    name: Build qemu-riscv64
    runs-on: [self-hosted, embedded_master, x86, cpu=8]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/openeuler-embedded-2/openeuler-ci:latest
    timeout-minutes: 360
    steps:
      - name: Checkout source code
        uses: checkout

      - name: Point the build at the PR
        run: bash .gitcode/workflows/scripts/checkout_pr.sh

      - name: Build qemu-riscv64 image
        run: |
          set -e
          echo "Building qemu-riscv64..."
          bash .gitcode/workflows/scripts/build_image.sh \
            riscv64 qemu-riscv64

  build_phytium:
    name: Build phytium
    runs-on: [self-hosted, embedded_master, x86, cpu=8]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/openeuler-embedded-2/openeuler-ci:latest
    timeout-minutes: 360
