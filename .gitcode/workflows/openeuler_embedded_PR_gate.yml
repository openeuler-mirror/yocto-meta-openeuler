        run: echo "build_x86_64 disabled for pipeline testing"

  build_hieulerpi1:
    name: Build hieulerpi1
    needs: code_check
    runs-on: [self-hosted, embedded_master, x86, cpu=4]
    timeout-minutes: 360
    steps:
      # image build disabled for pipeline testing (no runner build
      # environment yet); revert together with the code check stub.
      - name: Build image
        run: echo "build_hieulerpi1 disabled for pipeline testing"

  build_qemu_riscv64:
    name: Build qemu-riscv64
    needs: code_check
    runs-on: [self-hosted, embedded_master, x86, cpu=4]
    timeout-minutes: 360
    steps:
      # image build disabled for pipeline testing (no runner build
