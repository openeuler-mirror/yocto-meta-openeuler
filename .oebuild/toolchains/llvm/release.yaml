tag_name: llvm-toolchain-v0.1.2
name: openEuler Embedded LLVM Toolchains V0.1.2
body: 1.此发行版为对应LLVM Toolchains V0.1.2版本。
      2.产物按200M分卷发布（N_clang-llvm-17.0.6.tar.gz），请下载全部分卷压缩包及merge_data.sh文件。
      3.请给merge_data.sh文件可执行权限，并执行即可得到对应的工具链文件夹。
      4.更新内容：集成的GCC工具链相关文件变更为V0.1.9版本；产物由50M分卷（9卷）调整为200M分卷发布。
target_commitish: master
owner: openeuler
repo: yocto-meta-openeuler
