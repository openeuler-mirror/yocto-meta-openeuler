build_in: docker
machine: kp920
toolchain_type: EXTERNAL_TOOLCHAIN:aarch64
no_layer: false
repos:
- yocto-poky
- yocto-meta-openembedded
local_conf: |+
  DISTRO_FEATURES:append = " kernel6 "
  PREFERRED_VERSION_linux-openeuler ?= "6.6%"
  PREFERRED_VERSION_linux-openeuler-rt ?= "6.6%"
  PREFERRED_PROVIDER_virtual/kernel = "linux-openeuler-rt"
  DISTRO_FEATURES:append = " preempt-rt "
  DISTRO_FEATURES:append = " k3s-agent "
  IMAGE_INSTALL:append = " packagegroup-k3s-agent "
  INIT_MANAGER = "systemd"
  DISTRO_FEATURES:append = " xen "
  MCS_FEATURES:append = " xen "
  DISTRO_FEATURES:append = " virtualization containers "
  DISTRO_FEATURES:append = " containerd "
  VIRTUAL-RUNTIME_container_engine:append = " containerd "
  K3S_EXTERNAL_ENDPOINT ?= "containerd"
  MCS_FEATURES:append = " micrun new_tty_suffix "
  DISTRO_FEATURES:append = " mcs "
  MCS_FEATURES ?= "openamp"
  RPI_USE_UEFI:raspberrypi4-64 = "1"
  MCS_FEATURES:append = " zephyr "

layers:
- yocto-meta-openeuler/bsp/meta-kunpeng
- yocto-meta-openeuler/rtos/meta-openeuler-rtos
- yocto-meta-openeuler/rtos/meta-zephyr 
docker_param:
  image: swr.cn-north-4.myhuaweicloud.com/openeuler-embedded/openeuler-container:24.03-lts-next
  parameters: -itd --network host
  volumns:
  - /dev/net/tun:/dev/net/tun
  command: bash
bitbake_cmds:
- bitbake openeuler-image
- bitbake openeuler-image -c do_populate_sdk
