build_in: docker
machine: qemu-aarch64
toolchain_type: EXTERNAL_TOOLCHAIN:aarch64
no_layer: false
repos:
- yocto-poky
- yocto-meta-openembedded
local_conf: |+
  MCS_FEATURES ?= "external-firmware xen"
  DISTRO_FEATURES:append = " mcs xen"

  # zephyr.elf/zephyr.bin built by the external west workspace. Replace
  # /path/to/zephyrproject with your own workspace and keep the container
  # mount below in sync. The openamp_rsc_table sample sets KERNEL_BIN_NAME,
  # so the artifacts are zephyr_openamp_rsc_table.{elf,bin}. Xen boots
  # zephyr.bin as the client kernel and mica parses zephyr.elf for the
  # resource table.
  MCS_FIRMWARE_ELF ?= "/path/to/zephyrproject/builds/qemu_mcs_xen/zephyr/zephyr_openamp_rsc_table.elf"
  MCS_FIRMWARE_BIN ?= "/path/to/zephyrproject/builds/qemu_mcs_xen/zephyr/zephyr_openamp_rsc_table.bin"

layers: []
docker_param:
  image: swr.cn-north-4.myhuaweicloud.com/openeuler-embedded/openeuler-container:latest
  parameters: -itd --network host --cap-add NET_ADMIN
  volumns:
  - /dev/net/tun:/dev/net/tun
  - /path/to/zephyrproject:/path/to/zephyrproject:ro
  command: bash
bitbake_cmds:
- bitbake openeuler-image-mcs
- bitbake openeuler-image-mcs -c do_populate_sdk
