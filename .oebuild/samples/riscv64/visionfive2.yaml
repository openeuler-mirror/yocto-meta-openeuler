# Features: none (base image only; u-boot comes from the on-board flash)
build_in: docker
machine: starfive-dubhe
toolchain_type: EXTERNAL_TOOLCHAIN:riscv64
no_layer: false
repos:
- yocto-poky
- yocto-meta-openembedded
local_conf: |
layers:
- yocto-meta-openeuler/bsp/meta-visionfive2
docker_param:
  image: swr.cn-north-4.myhuaweicloud.com/openeuler-embedded/openeuler-container:latest
  parameters: -itd --network host
  volumns:
  - /dev/net/tun:/dev/net/tun
  command: bash
bitbake_cmds:
- bitbake openeuler-image