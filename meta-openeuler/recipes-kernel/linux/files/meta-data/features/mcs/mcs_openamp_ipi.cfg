# Temporary workaround for the bare-metal mcs_km driver, which hard-codes
# virq 8 (SGI 7, the last of the eight SGI virqs registered by the GIC
# driver) as its IPI contract with the RTOS firmware. Two options make the
# kernel claim that slot and the module fail with "IRQ 8 is not free":
#  - IPI_AS_NMI: turns the 8th IPI virq into a percpu NMI
#  - SMT_QOS: adds IPI_USER (NR_IPI 7 -> 8) so all eight slots are
#    registered as ordinary IPIs. Only some kernels carry the option
#    (e.g. the SP3 line); the line is a no-op where the symbol is absent.
# SGI 0-6 are the kernel's own IPIs, so picking another SGI is no way out:
# the proper fix is for mcs to move the RTOS -> Linux notification to an
# SPI. On mainline 6.7+ all eight SGIs are claimed unconditionally
# (IPI_CPU_BACKTRACE / IPI_KGDB_ROUNDUP) and this fragment is not enough.
# CONFIG_IPI_AS_NMI is not set
# CONFIG_SMT_QOS is not set
