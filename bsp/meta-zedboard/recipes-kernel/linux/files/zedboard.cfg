# Zynq-7000 (ZedBoard) support.
#
# The openEuler arm defconfig is QEMU-oriented and disables whole subsystems
# (MMC, WATCHDOG, IIO). With KCONFIG_MODE=alldefconfig, every symbol that is
# not listed takes its Kconfig default, so parent symbols must be enabled
# explicitly here as well as the Zynq drivers themselves.

CONFIG_ARCH_ZYNQ=y
CONFIG_CACHE_L2X0=y
CONFIG_SMP=y

# Console: PS UART (ttyPS0)
CONFIG_SERIAL_XILINX_PS_UART=y
CONFIG_SERIAL_XILINX_PS_UART_CONSOLE=y

# Ethernet: GEM + Marvell 88E1510 PHY (rootfs is on SD, net can be modular,
# but keep it built-in for early networkd setup). CONFIG_ETHERNET is disabled
# in the arm defconfig, which hides the whole vendor menu.
CONFIG_ETHERNET=y
CONFIG_NET_VENDOR_CADENCE=y
CONFIG_MACB=y
CONFIG_PHYLIB=y
CONFIG_MARVELL_PHY=y

# Storage: rootfs lives on the SD card, so MMC and ext4 must be built in
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PLTFM=y
CONFIG_MMC_SDHCI_OF_ARASAN=y
CONFIG_EXT4_FS=y
CONFIG_EXT4_USE_FOR_EXT2=y

# QSPI NOR (Zynq QSPI controller, 32MB flash on ZedBoard)
CONFIG_MTD=y
CONFIG_MTD_SPI_NOR=y
CONFIG_SPI_ZYNQ_QSPI=y

# I2C / SPI / GPIO (PS Cadence I2C, PS Cadence SPI, AXI SPI, PL GPIO)
CONFIG_I2C_CADENCE=m
CONFIG_I2C_XILINX=m
CONFIG_SPI_CADENCE=m
CONFIG_SPI_XILINX=y
# GPIO (MIO + EMIO) and the board I/O consumers
CONFIG_GPIO_ZYNQ=y
CONFIG_NEW_LEDS=y
CONFIG_LEDS_CLASS=y
CONFIG_LEDS_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_KEYBOARD=y
CONFIG_INPUT_EVDEV=y
CONFIG_KEYBOARD_GPIO=y

# USB host: PS USB0 is chipidea in host mode
CONFIG_USB_CHIPIDEA=m
CONFIG_USB_CHIPIDEA_HOST=y
CONFIG_USB_PHY=y
CONFIG_NOP_USB_XCEIV=y

# System control / watchdog / XADC
CONFIG_RESET_ZYNQ=y
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_CORE=y
CONFIG_CADENCE_WATCHDOG=y
CONFIG_IIO=y
CONFIG_XILINX_XADC=y

# PL programming (boot.scr programs the bitstream from U-Boot; keep the
# kernel-side manager for optional runtime reloads)
CONFIG_FPGA=y
CONFIG_FPGA_MGR=y
CONFIG_FPGA_MGR_ZYNQ_FPGA=y
CONFIG_FW_LOADER=y