#@TYPE: Machine
#@NAME: zedboard
#@DESCRIPTION: Digilent ZedBoard (Xilinx Zynq-7000, dual Cortex-A9)

# arm32 基线采用 openEuler 外部工具链（gcc 12.3 + glibc 2.38 + soft-float）。
# 与 qemu-arm 保持一致：armv7a + cortexa9 调优，去掉 vfp 特性以匹配软浮点 ABI。
require conf/machine/include/arm/arch-armv7a.inc

DEFAULTTUNE = "armv7a"
TUNE_FEATURES:append = " cortexa9"
TUNE_FEATURES:remove = " vfp"
TUNE_CCARGS .= " -mno-unaligned-access"

MACHINE_FEATURES = "serial ext2 ext3 ext4 usbhost"

SERIAL_CONSOLES = "115200;ttyPS0"
USE_VT = "0"

KERNEL_IMAGETYPE = "zImage"
KERNEL_IMAGETYPE_FOR_MAKE = "zImage"
KERNEL_DEVICETREE = "zynq-zed.dtb"

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

# Zynq 启动链：BootROM -> spl/boot.bin (U-Boot SPL) -> u-boot.img
UBOOT_MACHINE = "xilinx_zynq_virt_defconfig"
UBOOT_SUFFIX = "img"
UBOOT_BINARY = "u-boot.img"
SPL_BINARY = "spl/boot.bin"

# Boot flow: U-Boot runs boot.scr, which programs the PL bitstream (when
# present) and then boots the kernel. Generated by zedboard-bootfiles.
ZEDBOARD_BITSTREAM ?= "${@os.path.dirname(d.getVar('FILE'))}/../../files/bitstream/system.bit.bin.gz"
# resolve immediately, while FILE still points at this machine conf
ZEDBOARD_BITSTREAM := "${ZEDBOARD_BITSTREAM}"

IMAGE_BOOT_FILES = " \
    boot.bin;BOOT.BIN \
    u-boot.img \
    ${KERNEL_IMAGETYPE} \
    ${KERNEL_DEVICETREE} \
    boot.scr \
    "

WKS_FILE = "sdimage-zedboard.wks"
IMAGE_FSTYPES = "wic.bz2"