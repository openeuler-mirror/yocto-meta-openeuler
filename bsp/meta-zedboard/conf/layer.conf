# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-zedboard"
BBFILE_PATTERN_meta-zedboard = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-zedboard = "7"

LAYERVERSION_meta-zedboard = "1"
LAYERDEPENDS_meta-zedboard = "core"
LAYERSERIES_COMPAT_meta-zedboard = "kirkstone"