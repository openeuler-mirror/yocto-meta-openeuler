# The openeuler_defconfig sets CONFIG_DEBUG_INFO_BTF=y but the build
# container lacks pahole (PAHOLE_VERSION=0); without BTF disabled
# resolve_btfids fails to compile (libelf.h not found). Disable BTF
# explicitly and force-enable QOS_SCHED_DYNAMIC_AFFINITY (which
# otherwise defaults to n, breaking bpf_sched.c compilation).
# CONFIG_DEBUG_INFO_BTF is not set
CONFIG_QOS_SCHED_DYNAMIC_AFFINITY=y

# PAGEATTACH (zcopy) calls percpu_counter_atomic_add() which is
# introduced by the RT patchset and reverted by the rt revert patches;
# disable it for the RT kernel build to avoid the compile error.
# CONFIG_PAGEATTACH is not set
