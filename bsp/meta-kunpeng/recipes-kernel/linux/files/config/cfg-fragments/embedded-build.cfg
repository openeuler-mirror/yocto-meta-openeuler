# Enable BTF explicitly: the 6.6.0-175.0.0 openeuler_defconfig no
# longer sets CONFIG_DEBUG_INFO_BTF (the 174.0.0 one did, which is why
# it had to be force-disabled back then: the build container lacks
# pahole and resolve_btfids failed). pahole-native and elfutils-native
# are now added to the kernel DEPENDS (see linux-kp920.inc) and the
# 175.0.0 kernel converts the arch kfunc sets to BTF_KFUNCS_START/END,
# so BTF generation works. Keep force-enabling
# QOS_SCHED_DYNAMIC_AFFINITY (which otherwise defaults to n, breaking
# bpf_sched.c compilation).
CONFIG_DEBUG_INFO_BTF=y
CONFIG_QOS_SCHED_DYNAMIC_AFFINITY=y

# PAGEATTACH (zcopy) calls percpu_counter_atomic_add() which is
# introduced by the RT patchset and reverted by the rt revert patches;
# disable it for the RT kernel build to avoid the compile error.
# CONFIG_PAGEATTACH is not set
