# The openeuler_defconfig of both the 5.10 and 6.6 kernels sets
# CONFIG_DEBUG_INFO_BTF=y, but only the kernel6 flow gets pahole-native
# and elfutils-native in its DEPENDS (see linux-kp920.inc); the build
# container ships neither pahole nor libelf, so resolve_btfids would
# fail to compile. Disable BTF here for both flows; the kernel6 flow
# re-enables it through the later btf-kernel6.cfg fragment, where the
# 175.0.0 kernel fixes the BTF_KFUNCS conversion and the native
# tooling is available. Keep force-enabling
# QOS_SCHED_DYNAMIC_AFFINITY (which otherwise defaults to n, breaking
# bpf_sched.c compilation).
# CONFIG_DEBUG_INFO_BTF is not set
CONFIG_QOS_SCHED_DYNAMIC_AFFINITY=y

# PAGEATTACH (zcopy) calls percpu_counter_atomic_add() which is
# introduced by the RT patchset and reverted by the rt revert patches;
# disable it for the RT kernel build to avoid the compile error.
# CONFIG_PAGEATTACH is not set
