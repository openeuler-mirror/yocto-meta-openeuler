# Re-enable BTF for the kernel6 flow only (applied after
# embedded-build.cfg, so this wins for 6.6): the 6.6.0-175.0.0 kernel
# converts the arch kfunc sets to BTF_KFUNCS_START/END and the kernel6
# DEPENDS provide pahole-native and elfutils-native, so BTF generation
# works. The 5.10 flow keeps BTF disabled: it has no native tooling
# and its in-tree openeuler_defconfig would otherwise enable BTF and
# break resolve_btfids against the missing container libelf.
CONFIG_DEBUG_INFO_BTF=y
